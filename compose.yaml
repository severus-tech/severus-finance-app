services:
  postgres:
    image: postgres:16-alpine
    container_name: severus-finance-postgres
    environment:
      POSTGRES_DB: severus_finance
      POSTGRES_USER: severus
      POSTGRES_PASSWORD: severus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U severus -d severus_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
