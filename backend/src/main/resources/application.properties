# Quarkus Server Configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# Datasource Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/severus_finance}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:severus}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:severus_password}

# Agroal Connection Pool (Free tier optimized)
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=15s
quarkus.datasource.jdbc.idle-removal-interval=5M

# Hibernate ORM & Flyway Migration Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Profile Specific Hibernate Generation
%dev.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.database.generation=validate
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

# Security & SmallRye JWT Configuration
mp.jwt.verify.issuer=https://severus-finance.com
smallrye.jwt.token.issuer=https://severus-finance.com
smallrye.jwt.token.signature-algorithm=HS256
smallrye.jwt.verify.key=${JWT_SECRET:severus_finance_super_secret_jwt_signature_key_2026_safe}
smallrye.jwt.sign.key=${JWT_SECRET:severus_finance_super_secret_jwt_signature_key_2026_safe}

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=${ALLOWED_ORIGIN:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,X-Correlation-ID
quarkus.http.cors.access-control-allow-credentials=true

# Open API & Swagger UI
%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false
%prod.quarkus.swagger-ui.enable=false

# Health Checks
quarkus.smallrye-health.root-path=/q/health

# Application Custom Configuration
app.single-user.email=${SINGLE_USER_EMAIL:severus.technology@gmail.com}
app.single-user.password=${SINGLE_USER_PASSWORD:1234567890}
app.jwt.secret=${JWT_SECRET:severus_finance_super_secret_jwt_signature_key_2026_safe}
